<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Técnica - Expositores</title>
    <!-- Agrega aquí tus estilos CSS o frameworks -->
</head>
<body>

    <form action="https://formsubmit.co/avilamich" method="POST">
        
        <!-- CORRECCIÓN DEL BOTÓN VOLVER: Redirige exactamente a tu subpágina -->
        <input type="hidden" name="_next" value="https://maycoltar321.github.io/FICHA_Tecnica_expositores/">
        
        <!-- MEJORA DE FORMATO: Organiza los datos en una tabla limpia dentro del correo -->
        <input type="hidden" name="_template" value="table">
        
        <!-- ASUNTO PERSONALIZADO: Para identificar los registros fácilmente en tu bandeja -->
        <input type="hidden" name="_subject" value="Nueva Ficha Técnica - Expositor Registrado">

        <!-- Evita campos molestos de reCAPTCHA si deseas que el envío sea directo -->
        <input type="hidden" name="_captcha" value="false">

        <h2>Ficha Técnica de Expositor</h2>
        
        <div style="margin-bottom: 15px;">
            <label for="nombre">Nombre Completo:</label><br>
            <input type="text" id="nombre" name="Nombre Completo" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="email">Correo Electrónico:</label><br>
            <input type="email" id="email" name="Correo" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="telefono">Teléfono / Celular:</label><br>
            <input type="tel" id="telefono" name="Telefono" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="tematica">Tema o Título de Exposición:</label><br>
            <textarea id="tematica" name="Tema de Exposicion" rows="4" required style="width: 100%; padding: 8px;"></textarea>
        </div>

        <button type="submit" style="background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            Enviar Ficha Técnica
        </button>
    </form>

</body>
</html>
